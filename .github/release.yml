changelog:
  exclude:
    labels:
      - Dependencies
    authors:
      - renovate
      - github-actions
  categories:
    - title: '🚀 Features'
      labels:
        - 'Type: Enhancement'
    - title: '🐛 Bug Fixes'
      labels:
        - 'Type: Bug'
        - 'Type: Support'
    - title: '🧰 Maintenance'
      labels:
        - 'Type: Tooling'
        - 'Type: Code Quality'
        - 'Type: Performance'
    - title: '📝 Documentation'
      labels:
        - 'Type: Documentation'
    - title: '❌ Removals'
      labels:
        - 'Type: Deprecation'
    - title: 'Other Changes'
      labels:
        - '*'
